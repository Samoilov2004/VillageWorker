<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../files/images/logo/ЭТС 2 (FFCC00).png" />
  <title>ЭТС / ИИ-Ассистент</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/media.css" />
  <style>
    body {
      color: white;
      font-family: 'Comfortaa', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1D1D1D;
    }
    :root { --green: #256d3c; --green-light: #2e8b4a; }

    /* ── Chat layout ── */
    .assistant-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px 16px;
    }

    /* ── Header card ── */
    .assistant-header {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 20px 24px;
      margin: 24px 0 16px;
      flex-shrink: 0;
    }
    .assistant-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), #4caf50);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .assistant-info h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
    .assistant-info p  { margin: 0; font-size: 13px; color: #aaa; }
    .online-dot {
      width: 10px; height: 10px;
      background: #4caf50;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .4; }
    }

    /* ── Messages ── */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-track { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .msg-row.msg-user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), #4caf50);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .msg-bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
    }
    .msg-bubble--bot {
      background: #262626;
      border: 1px solid #333;
      border-bottom-left-radius: 4px;
    }
    .msg-bubble--user {
      background: var(--green);
      border-bottom-right-radius: 4px;
    }
    .msg-time {
      font-size: 11px;
      margin-top: 6px;
      opacity: .55;
      text-align: right;
    }
    .msg-bubble--bot .msg-time { text-align: left; }

    /* ── Typing dots ── */
    .typing-dots {
      display: inline-flex;
      gap: 5px;
      padding: 4px 0;
    }
    .typing-dots span {
      width: 8px; height: 8px;
      background: #888;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }

    /* ── Example questions ── */
    .examples-wrap {
      padding: 10px 4px 4px;
      flex-shrink: 0;
    }
    .examples-label {
      font-size: 11px;
      color: #666;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #exampleQuestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .example-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all .18s;
      font-family: inherit;
      white-space: nowrap;
    }
    .example-btn:hover {
      border-color: var(--green);
      color: #fff;
      background: rgba(37,109,60,.15);
    }

    /* ── Input form ── */
    .input-wrap {
      flex-shrink: 0;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #assistantInput {
      flex: 1;
      background: #262626;
      border: 1px solid #3a3a3a;
      border-radius: 16px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 120px;
      line-height: 1.45;
      transition: border-color .2s;
    }
    #assistantInput:focus { border-color: var(--green); }
    #assistantInput::placeholder { color: #555; }

    #assistantSendBtn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .18s, transform .1s;
    }
    #assistantSendBtn:hover    { background: var(--green-light); }
    #assistantSendBtn:active   { transform: scale(.94); }
    #assistantSendBtn:disabled { background: #333; cursor: not-allowed; }

    /* ── Disclaimer ── */
    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .assistant-wrap { height: calc(100vh - 100px); padding: 0 8px 8px; }
      .msg-bubble { max-width: 85%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="menu">
      <a class="logo" href="../main.html"><img src="../files/images/logo/ЭТС 1_2 (FFCC00).png" width="200px" alt="ЭТС" /></a>
      <div>
        <a href="profile.html">Профиль</a>
        <a href="applications.html">Отклики</a>
        <a href="job_search.html">Вакансии</a>
        <a href="support.html">Поддержка</a>
      </div>
    </div>
    <div class="add_menu">
      <div><img src="../files/images/icon/material-symbols_navigation-outline-rounded.png" /><a class="city" href="#">Москва</a></div>
      <a href="#"><img src="../files/images/icon/material-symbols_mail-outline-rounded.png" alt="" /></a>
      <a href="#"><img src="../files/images/icon/material-symbols_favorite-outline-rounded.png" alt="" /></a>
      <a href="#"><img src="../files/images/icon/material-symbols_notifications-outline-rounded.png" alt="" /></a>
      <button class="create_resume" onclick="window.location.href='create.html'">Создать резюме</button>
    </div>
    <div class="gorod"><img src="../files/images/icon/material-symbols_navigation-outline-rounded.png" /><a class="city" href="#">Москва</a></div>
    <input type="checkbox" id="burger-checkbox" class="burger-checkbox" />
    <label class="burger" for="burger-checkbox"></label>
    <ul class="menu-list">
      <div class="burger_icon">
        <a href="#"><img src="../files/images/icon/material-symbols_mail-outline-rounded.png" alt="" /></a>
        <a href="#"><img src="../files/images/icon/material-symbols_favorite-outline-rounded.png" alt="" /></a>
        <a href="#"><img src="../files/images/icon/material-symbols_notifications-outline-rounded.png" alt="" /></a>
      </div>
      <li><a href="profile.html" class="menu-item">Профиль</a></li>
      <li><a href="applications.html" class="menu-item">Отклики</a></li>
      <li><a href="job_search.html" class="menu-item">Вакансии</a></li>
      <li><a href="support.html" class="menu-item">Поддержка</a></li>
    </ul>
  </header>

  <div class="assistant-wrap">
    <!-- Профиль ассистента -->
    <div class="assistant-header">
      <div class="assistant-avatar">👩</div>
      <div class="assistant-info">
        <h2>Надежда</h2>
        <p><span class="online-dot"></span>ИИ-ассистент платформы ЭТС · Всегда онлайн</p>
      </div>
    </div>

    <!-- Сообщения -->
    <div class="messages-area" id="assistantMessages"></div>

    <!-- Примеры вопросов -->
    <div class="examples-wrap">
      <div class="examples-label">Примеры вопросов</div>
      <div id="exampleQuestions"></div>
    </div>

    <!-- Форма ввода -->
    <div class="input-wrap">
      <form class="input-row" id="assistantForm">
        <textarea
          id="assistantInput"
          placeholder="Напишите вопрос Надежде..."
          rows="1"
        ></textarea>
        <button type="submit" id="assistantSendBtn" title="Отправить">
          <i data-lucide="send" style="width:20px;height:20px;"></i>
        </button>
      </form>
      <div class="disclaimer">Надежда — ИИ-ассистент, может ошибаться. Для сложных вопросов пишите в <a href="support.html" style="color:#555;text-decoration:underline;">Поддержку</a>.</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
  <script src="../js/ai_assistant.js"></script>
</body>
</html>
